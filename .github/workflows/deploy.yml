name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy with no traffic, then shift
        run: |
          set -euo pipefail
          for service in api worker web; do
            gcloud run deploy "$service" \
              --project "${{ vars.DEV_PROJECT }}" \
              --region "${{ vars.REGION }}" \
              --image "${{ vars.AR_HOST }}/$service:${GITHUB_SHA}" \
              --no-traffic \
              --tag "rev-${GITHUB_SHA::7}"
            url=$(gcloud run services describe "$service" --region "${{ vars.REGION }}" --format='value(status.traffic[0].url)')
            curl -fsS "$url/healthz"
            gcloud run services update-traffic "$service" --region "${{ vars.REGION }}" --to-tags "rev-${GITHUB_SHA::7}=10"
            gcloud run services update-traffic "$service" --region "${{ vars.REGION }}" --to-latest
          done

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Shift traffic back to the stable tag
        run: |
          gcloud run services update-traffic api --region "${{ vars.REGION }}" --to-tags stable=100
          gcloud run services update-traffic worker --region "${{ vars.REGION }}" --to-tags stable=100
          gcloud run services update-traffic web --region "${{ vars.REGION }}" --to-tags stable=100
