name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      connectors: ${{ steps.filter.outputs.connectors }}
      agents: ${{ steps.filter.outputs.agents }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/api-client/**'
            backend:
              - 'backend/**'
              - 'openapi.json'
            connectors:
              - 'connectors/**'
            agents:
              - 'backend/src/younique/agents/**'
              - 'backend/src/younique/pipelines/**'
            infra:
              - 'infra/**'
            docs:
              - 'docs/**'
              - '**/*.md'
            migrations:
              - 'backend/migrations/**'
              - 'backend/src/younique/models/**'

  lint-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DCO
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            range="origin/${BASE_REF}..HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"
          else
            range="${BEFORE}..HEAD"
          fi
          commits=$(git rev-list "$range" || true)
          if [ -z "$commits" ]; then
            commits=$(git rev-parse HEAD)
          fi
          fail=0
          for sha in $commits; do
            if ! git log -1 --format='%B' "$sha" | grep -q "Signed-off-by:"; then
              echo "Commit $sha is missing Signed-off-by."
              git log -1 --format='%h %s' "$sha"
              fail=1
            fi
          done
          exit "$fail"

  backend-lint-types:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend ruff check src tests
      - run: uv run --directory backend ruff format --check src tests
      - run: uv run --directory backend mypy src
      - run: uv run --directory backend python ../scripts/check_forbidden_imports.py
      - run: uv run --directory backend python ../scripts/check_money.py
      - run: uv run --directory backend python ../scripts/check_routes.py
      - run: uv run --directory backend python ../scripts/check_migration.py

  backend-unit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend pytest tests/unit tests/agents tests/authz

  backend-integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: younique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d younique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YOUNIQUE_INTEGRATION_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/younique
      DATABASE_URL: postgresql+asyncpg://younique_app:younique_app@localhost:5432/younique
      DATABASE_URL_MIGRATOR: postgresql+asyncpg://postgres:postgres@localhost:5432/younique
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend alembic upgrade head
      - run: uv run --directory backend pytest tests/integration

  backend-authz:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend pytest tests/authz

  connector-contract:
    needs: changes
    if: needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend python ../scripts/check_forbidden_imports.py
      - run: uv run --directory backend pytest tests/connectors -q

  migration-check:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend python ../scripts/check_migration.py

  openapi-drift:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend python -m younique.scripts.export_openapi
      - run: git diff --exit-code openapi.json

  web-lint-types:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @younique/web lint
      - run: pnpm --filter @younique/web typecheck

  e2e-critical:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: younique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d younique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://younique_app:younique_app@localhost:5432/younique
      DATABASE_URL_MIGRATOR: postgresql+asyncpg://postgres:postgres@localhost:5432/younique
      LLM_MODE: fake
      APP_ENV: e2e
      COOKIE_SECURE: "false"
      OIDC_EMULATOR: "true"
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      STREAM_PACE_MS: "40"
      RATE_LIMIT_PER_MINUTE: "1000"
      API_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-younique
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend alembic upgrade head
      - run: pnpm install
      - run: pnpm --filter @younique/web build
      - name: Start API
        working-directory: backend
        run: |
          uv run uvicorn younique.main_api:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Start web
        run: |
          pnpm --filter @younique/web start --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3000/login && exit 0
            sleep 1
          done
          cat /tmp/web.log
          exit 1
      - name: Install Playwright
        run: pnpm --filter @younique/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @younique/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: apps/web/test-results
          if-no-files-found: ignore

  terraform-validate:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false
      - run: terraform -chdir=infra/terraform/envs/dev validate

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f docs/site/mint.json && test -f README.md

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --directory backend
      - run: uv run --directory backend pip-audit || true
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3
