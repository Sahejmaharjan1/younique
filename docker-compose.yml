services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: younique
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d younique"]
      interval: 2s
      timeout: 5s
      retries: 30

  firebase:
    build:
      context: ./infra/docker/firebase
    ports:
      - "9099:9099"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9099').then(r=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 40

  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4443/storage/v1/b"]
      interval: 3s
      timeout: 5s
      retries: 30

  cloudtasks:
    build:
      context: ./infra/docker/cloudtasks
    environment:
      WORKER_URL: http://host.docker.internal:8001
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    ports:
      - "3310:3310"

  langfuse:
    image: langfuse/langfuse:2.93.1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev-nextauth-secret-not-for-prod
      SALT: dev-salt-not-for-prod
      TELEMETRY_ENABLED: "false"
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
