providers:
  - key: anthropic
    display_name: Anthropic
  - key: openai
    display_name: OpenAI
  - key: google
    display_name: Google
  - key: openai_compatible
    display_name: OpenAI compatible
  - key: fake
    display_name: Fake
models:
  - provider: anthropic
    model_ref: claude-sonnet-4-5
    display_name: Claude Sonnet 4.5
    context_window: 200000
    max_output_tokens: 8192
    supports_tools: true
    supports_reasoning: true
    reasoning_control: budget_tokens
    input_micro_usd_per_mtok: 3000000
    output_micro_usd_per_mtok: 15000000
    cached_input_micro_usd_per_mtok: 300000
    reasoning_micro_usd_per_mtok: 15000000
  - provider: openai
    model_ref: gpt-4.1
    display_name: GPT-4.1
    context_window: 128000
    max_output_tokens: 8192
    supports_tools: true
    supports_reasoning: false
    reasoning_control: none
    input_micro_usd_per_mtok: 2000000
    output_micro_usd_per_mtok: 8000000
    cached_input_micro_usd_per_mtok: 500000
    reasoning_micro_usd_per_mtok: 0
  - provider: fake
    model_ref: fake-chat
    display_name: Fake chat
    context_window: 32000
    max_output_tokens: 4096
    supports_tools: true
    supports_reasoning: true
    reasoning_control: boolean
    input_micro_usd_per_mtok: 0
    output_micro_usd_per_mtok: 0
    cached_input_micro_usd_per_mtok: 0
    reasoning_micro_usd_per_mtok: 0
