[project]
name = "younique-sdk"
version = "0.1.0"
description = "Apache-2.0 connector SDK for Younique"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10.4",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/younique_sdk"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
